name: daily-weather-push

# 触发方式:① 每天定时;② 手动点按钮(调试用)
on:
  schedule:
    # cron 用 UTC 时间,北京时间 = UTC + 8。一天三次;分钟错开整点,降低被 GitHub 延迟/跳过的概率:
    - cron: '32 0 * * *'   # UTC 00:32 = 北京 08:32 早间
    - cron: '7 7 * * *'    # UTC 07:07 = 北京 15:07 午后
    - cron: '13 12 * * *'  # UTC 12:13 = 北京 20:13 晚间
    # 注意:GitHub 定时任务高峰期仍可能延迟几分钟到几十分钟、偶尔跳过,属正常(无 SLA)。
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - uses: actions/checkout@v4

      # 2. 装 Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. 装依赖
      - run: pip install -r requirements.txt

      # 4. 运行推送脚本;敏感值从 GitHub Secrets 注入,城市直接写明文
      - run: python main.py
        env:
          APPID: ${{ secrets.APPID }}
          APPSECRET: ${{ secrets.APPSECRET }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          OPENID: ${{ secrets.OPENID }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          QWEATHER_HOST: ${{ secrets.QWEATHER_HOST }}
          CITY: 北京市昌平区,北京市海淀区
