name: weather-push

# 定时触发按 UTC 书写；北京时间 = UTC + 8。
on:
  schedule:
    # 仅检查未来 24 小时。无降水或不良天气时脚本会成功结束，不发送微信消息。
    - cron: '3 21 * * *'  # 北京时间 05:03（UTC 前一天）
    - cron: '3 2 * * *'   # 北京时间 10:03
    - cron: '3 10 * * *'  # 北京时间 18:03
    # 每天固定发送一次简洁的明日天气摘要。
    - cron: '3 15 * * *'  # 北京时间 23:03
  workflow_dispatch:
    inputs:
      mode:
        description: Run a monitoring check or the nightly summary
        required: false
        default: summary
        type: choice
        options:
          - summary
          - monitor

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          # 手动运行默认发送晚间摘要；三个监测 cron 使用 monitor，23:03 cron 使用 summary。
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '3 15 * * *' && 'summary' || 'monitor') }}
          APPID: ${{ secrets.APPID }}
          APPSECRET: ${{ secrets.APPSECRET }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          OPENID: ${{ secrets.OPENID }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          QWEATHER_HOST: ${{ secrets.QWEATHER_HOST }}
          CITY: 北京市昌平区,北京市海淀区
