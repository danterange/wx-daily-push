name: daily-weather-push

# 触发方式:① 每天定时;② 手动点按钮(调试用)
on:
  schedule:
    # cron 用 UTC 时间,北京时间 = UTC + 8。一天四次;分钟错开整点,降低被 GitHub 延迟/跳过的概率:
    - cron: '32 0 * * *'   # UTC 00:32 = 北京 08:32 (早八点半)
    - cron: '3 4 * * *'    # UTC 04:03 = 北京 12:03 (中午十二点)
    - cron: '4 9 * * *'    # UTC 09:04 = 北京 17:04 (下午五点)
    - cron: '3 15 * * *'   # UTC 15:03 = 北京 23:03 (晚上十一点)
    # 注意:GitHub 定时任务仍 best-effort,高峰期可能延迟几分钟、偶尔跳过(无 SLA)。
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - uses: actions/checkout@v4

      # 2. 装 Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. 装依赖
      - run: pip install -r requirements.txt

      # 4. 运行推送脚本;敏感值从 GitHub Secrets 注入,城市直接写明文
      - run: python main.py
        env:
          APPID: ${{ secrets.APPID }}
          APPSECRET: ${{ secrets.APPSECRET }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          OPENID: ${{ secrets.OPENID }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          QWEATHER_HOST: ${{ secrets.QWEATHER_HOST }}
          CITY: 北京市昌平区,北京市海淀区
